[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["apps/backend/src/docuweave/infrastructure/database/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests"]
