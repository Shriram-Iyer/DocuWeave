[project]
name = "docuweave-backend"
version = "0.1.0"
description = "DocuWeave backend — document generation platform"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    # Validation & settings
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Template DB — SQL (PostgreSQL / MySQL)
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    # Template DB — MongoDB
    "motor>=3.7",
    "beanie>=1.28",
    # Document generation
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # Utilities
    "python-multipart>=0.0.20",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",          # for FastAPI TestClient async
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docuweave"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["src/docuweave/infrastructure/database/migrations/"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
